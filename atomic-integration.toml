schema = 1
agent = "claude-code"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[skills-source]
package = "atomic-skills"

[skills]
install = "all"
dst_pattern = "~/.claude/skills/{name}/SKILL.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

[agent-definition]
src = "agents/intent.md.frontmatter"
body_from = "atomic-skills:AGENTS.md"
slot = "~/.claude/agents/intent.md"

[[settings]]
manifest = "hooks/claude-code.atomic-hooks.json"
