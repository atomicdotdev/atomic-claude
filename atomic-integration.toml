schema = 1
agent = "claude-code"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[skills-source]
package = "atomic-skills"

[[skill]]
src = "skills/atomic-vault/SKILL.md"
dst = "~/.claude/skills/atomic-vault/SKILL.md"

[[skill]]
src = "skills/atomic-vcs/SKILL.md"
dst = "~/.claude/skills/atomic-vcs/SKILL.md"

[[skill]]
src = "skills/code-intelligence/SKILL.md"
dst = "~/.claude/skills/code-intelligence/SKILL.md"

[[skill]]
src = "skills/intent-builder/SKILL.md"
dst = "~/.claude/skills/intent-builder/SKILL.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

[agent-definition]
src = "agents/intent.md.frontmatter"
body_from = "atomic-skills:AGENTS.md"
slot = "~/.claude/agents/intent.md"

[[settings]]
manifest = "hooks/claude-code.atomic-hooks.json"
